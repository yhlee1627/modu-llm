[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modu-llm"
version = "0.2.1"
description = "『모두의 LLM with 파이썬』 실습 패키지"
requires-python = ">=3.9"
# torch는 Colab에 이미 설치되어 있으므로 다시 설치하지 않습니다.
dependencies = ["numpy", "datasets", "huggingface_hub"]

[tool.setuptools]
packages = ["modu_llm"]
